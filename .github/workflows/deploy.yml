# This file lives in two repos that share one history, and it is active in
# only one of them:
#
#   ObsisMc/ObsisMc.github.io  -> ACTIVE. Runs on every push to main and
#                                 serves https://ruihaozhang.com.
#   ObsisMc/iBlog-astro        -> dormant. Actions is disabled and Pages is
#                                 not enabled there, so nothing runs.
#
# Authoring happens in iBlog-astro; publishing is a separate, deliberate step
# (`npm run publish`, i.e. git push githubio main) so that unfinished work can
# be pushed without going live. Do not enable Actions in iBlog-astro without
# first deciding which repo owns the deploy — two builds would race onto the
# same domain. See the "Publishing" section in AGENTS.md.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
